name: nightly-tests

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      simulate_failure:
        type: boolean
        default: false

permissions:
  contents: read                  # the issue is created with the PAT below, not GITHUB_TOKEN

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv has no floating @vN tags since v8: pin the release
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked

      - name: Run tests
        shell: bash                 # bash -eo pipefail, so tee doesn't hide the failure
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: uv run pytest -q 2>&1 | tee pytest.log

      - name: Open an issue and assign it to Copilot
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}   # user token: fine-grained PAT
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(printf 'Nightly tests failed.\n\nTriggering run: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(tail -n 60 pytest.log)")
          jq -n --arg title "Nightly tests failed (run ${{ github.run_id }})" \
                --arg body "$BODY" --arg repo "$REPO" \
                '{title: $title, body: $body,
                  assignees: ["copilot-swe-agent[bot]"],
                  agent_assignment: {target_repo: $repo, base_branch: "main",
                    custom_instructions: "Fix the failing test. Link the triggering run in the PR description.",
                    custom_agent: "", model: ""}}' \
          | gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/issues" --input -
