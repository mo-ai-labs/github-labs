<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 833 438" width="833" height="438" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="10" y="0" width="833" height="438" fill="#ffffff"/><rect x="30" y="95" width="190" height="52" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef"/><rect x="220" y="95" width="300" height="52" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffc9c9"/><rect x="520" y="95" width="300" height="52" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d0ebff"/><rect x="30" y="147" width="190" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><rect x="220" y="147" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff9db"/><rect x="520" y="147" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><rect x="30" y="207" width="190" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><rect x="220" y="207" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff5f5"/><rect x="520" y="207" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><rect x="30" y="267" width="190" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><rect x="220" y="267" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff5f5"/><rect x="520" y="267" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><rect x="30" y="327" width="190" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa"/><rect x="220" y="327" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff9db"/><rect x="520" y="327" width="300" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff"/><text x="30.0" y="42.0" font-size="22" fill="#1e1e1e" text-anchor="start">Hook failures: only GATES can say no</text><text x="30.0" y="68.0" font-size="14" fill="#495057" text-anchor="start">Gate = runs BEFORE the action and can block it. Observer = runs around/after it, so failures fail open.</text><text x="125.0" y="126.6" font-size="15" fill="#1e1e1e" text-anchor="middle">What the hook does</text><text x="370.0" y="117.2" font-size="15" fill="#1e1e1e" text-anchor="middle">GATE</text><text x="370.0" y="136.0" font-size="15" fill="#1e1e1e" text-anchor="middle">preToolUse · permissionRequest</text><text x="670.0" y="117.5" font-size="14" fill="#1e1e1e" text-anchor="middle">OBSERVER</text><text x="670.0" y="135.0" font-size="14" fill="#1e1e1e" text-anchor="middle">postToolUse · errorOccurred · …</text><text x="125.0" y="182.6" font-size="15" fill="#1e1e1e" text-anchor="middle">exit 0</text><text x="370.0" y="173.5" font-size="14" fill="#1e1e1e" text-anchor="middle">stdout JSON decides</text><text x="370.0" y="191.0" font-size="14" fill="#1e1e1e" text-anchor="middle">(no output = normal flow)</text><text x="670.0" y="182.2" font-size="14" fill="#1e1e1e" text-anchor="middle">runs, output used</text><text x="125.0" y="242.6" font-size="15" fill="#1e1e1e" text-anchor="middle">exit 2</text><text x="370.0" y="233.5" font-size="14" fill="#c92a2a" text-anchor="middle">DENY</text><text x="370.0" y="251.0" font-size="14" fill="#c92a2a" text-anchor="middle">(even if stdout says allow)</text><text x="670.0" y="233.5" font-size="14" fill="#1e1e1e" text-anchor="middle">warning, run continues</text><text x="670.0" y="251.0" font-size="14" fill="#1e1e1e" text-anchor="middle">(postToolUseFailure: stdout = hint)</text><text x="125.0" y="302.6" font-size="15" fill="#1e1e1e" text-anchor="middle">other non-zero / crash</text><text x="370.0" y="302.2" font-size="14" fill="#c92a2a" text-anchor="middle">DENY (fail-closed)</text><text x="670.0" y="302.2" font-size="14" fill="#1e1e1e" text-anchor="middle">logged, run continues</text><text x="125.0" y="362.6" font-size="15" fill="#1e1e1e" text-anchor="middle">timeout</text><text x="370.0" y="353.5" font-size="14" fill="#1e1e1e" text-anchor="middle">fail-OPEN: normal</text><text x="370.0" y="371.0" font-size="14" fill="#1e1e1e" text-anchor="middle">permission flow</text><text x="670.0" y="362.2" font-size="14" fill="#1e1e1e" text-anchor="middle">logged, run continues</text><text x="30.0" y="415.0" font-size="14" fill="#c92a2a" text-anchor="start">Trap: a slow guard that times out lets the edit through. Keep guards local and fast.</text></svg>