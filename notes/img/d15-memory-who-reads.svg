size="24" fill="#1e1e1e" text-anchor="start">Who reads which memory? (Feature availability)</text><text x="35.0" y="99.0" font-size="17" fill="#1e1e1e" text-anchor="start">Repository-level facts</text><text x="35.0" y="120.2" font-size="17" fill="#1e1e1e" text-anchor="start">shared by everyone in the repo</text><text x="35.0" y="141.5" font-size="17" fill="#1e1e1e" text-anchor="start">(with Memory on)</text><text x="35.0" y="249.0" font-size="17" fill="#1e1e1e" text-anchor="start">User-level preferences</text><text x="35.0" y="270.2" font-size="17" fill="#1e1e1e" text-anchor="start">ONE user, across all repos</text><text x="475.0" y="97.0" font-size="17" fill="#1e1e1e" text-anchor="start">Copilot cloud agent</text><text x="475.0" y="118.2" font-size="17" fill="#1e1e1e" text-anchor="start">facts + prefs*</text><text x="475.0" y="187.0" font-size="17" fill="#1e1e1e" text-anchor="start">Copilot CLI</text><text x="475.0" y="208.2" font-size="17" fill="#1e1e1e" text-anchor="start">facts + INITIATING user&#x27;s prefs only</text><text x="475.0" y="277.0" font-size="17" fill="#1e1e1e" text-anchor="start">Copilot code review</text><text x="475.0" y="298.2" font-size="17" fill="#1e1e1e" text-anchor="start">facts ONLY (no prefs)</text><text x="475.0" y="367.0" font-size="17" fill="#1e1e1e" text-anchor="start">Agentic autofix</text><text x="475.0" y="388.2" font-size="17" fill="#1e1e1e" text-anchor="start">facts*</text><text x="470.0" y="447.0" font-size="17" fill="#c92a2a" text-anchor="start">✗ code review never applies user preferences</text><text x="20.0" y="447.0" font-size="17" fill="#1e1e1e" text-anchor="start">A fact learned by one feature can be</text><text x="20.0" y="468.2" font-size="17" fill="#1e1e1e" text-anchor="start">applied by another (cloud agent → review)</text><text x="20.0" y="504.0" font-size="14" fill="#868e96" text-anchor="start">* this section only spells out CLI and code review; cloud agent/autofix shown as the doc&#x27;s default</text></svg>